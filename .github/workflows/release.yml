name: Release
# 5-platform binary release; dispatch with dry_run=true to build-only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no GitHub Release)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: mpm

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="${BIN_NAME}-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "${env:BIN_NAME}-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          if (-not $env:GITHUB_REF_NAME) { $name = "${env:BIN_NAME}-dev-${{ matrix.target }}" }
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe" "dist/$name/"
          foreach ($f in @('README.md','LICENSE')) {
            if (Test-Path $f) { Copy-Item $f "dist/$name/" }
          }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ASCII "dist/$name.zip.sha256"

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.${{ matrix.archive }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage installers (pin default version to this tag)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/MPM_VERSION=\"\${MPM_VERSION:-latest}\"/MPM_VERSION=\"\${MPM_VERSION:-$version}\"/" install.sh > dist/install.sh
          sed "s/if (\$env:MPM_VERSION) { \$env:MPM_VERSION } else { 'latest' }/if (\$env:MPM_VERSION) { \$env:MPM_VERSION } else { '$version' }/" install.ps1 > dist/install.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/install.sh
            dist/install.ps1
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Install

            One-line install (anonymous GitHub download, no account/token):

            **Linux / macOS**
            ```
            curl -sSfL https://github.com/coseto6125/markdown-project-manager/releases/download/${{ github.ref_name }}/install.sh | sh
            ```

            **Windows PowerShell**
            ```
            irm https://github.com/coseto6125/markdown-project-manager/releases/download/${{ github.ref_name }}/install.ps1 | iex
            ```

            **From source (any platform, needs Rust)**
            ```
            cargo install --git https://github.com/coseto6125/markdown-project-manager --tag ${{ github.ref_name }} --bin mpm --locked
            ```

            Or pick a `.tar.gz` / `.zip` matching your platform from Assets below; each has a `.sha256` for integrity.
